<style>
:root{--ink:#0a0a0a;--muted:#6b6b6b;--line:#e8e8e8;--bg:#fff;--soft:#f6f6f6;--gold:#c9a24b;--red:#c8102e;--orange:#f08a24;--green:#16a34a;--line-green:#06c755;--radius:28px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Thai','Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:500}
.h2{font-size:clamp(26px,3.4vw,36px);font-weight:700;margin:6px 0 4px}
.sub{color:var(--muted);font-size:15px}
section.blk{padding:72px 0 0}
.nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:.3s;color:#fff}
.nav.solid{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);color:var(--ink);border-bottom:1px solid var(--line)}
.nav .in{display:flex;align-items:center;justify-content:space-between;height:76px;padding:0 48px;gap:12px}
.brand{display:flex;align-items:center;gap:14px;font-weight:600}
.brand svg{width:26px;height:40px}.brand img{height:40px;width:auto}
.nav-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-white{background:#fff;color:var(--ink)}
.btn-ghost{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;backdrop-filter:blur(8px)}
.btn-line{background:var(--line-green);color:#fff}
.btn-dark{background:var(--ink);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-out{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn-google{background:#fff;color:var(--ink);padding:11px 20px;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.nav.solid .btn-google{background:var(--ink);color:#fff}
.g{width:20px;height:20px}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;color:#fff;background:#111 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.65))}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:160px;background:linear-gradient(transparent,#fff)}
.hero .wrap{position:relative;z-index:2;padding-top:90px}
.hero h1{font-family:Inter,'IBM Plex Sans Thai',sans-serif;font-size:clamp(48px,9vw,112px);line-height:1.02;font-weight:700;letter-spacing:-.03em;margin:22px 0 28px}
.hero p{font-size:clamp(17px,2vw,24px);max-width:760px;opacity:.9;margin-bottom:38px}
.hero .row{display:flex;flex-wrap:wrap;gap:14px}
.head{margin-bottom:32px}
.news-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.card{position:relative;aspect-ratio:1/1.05;border-radius:var(--radius);overflow:hidden;background:#111;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 10px 40px rgba(0,0,0,.14);transition:.35s;cursor:pointer;text-align:left;width:100%}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.card .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.6s}
.card:hover .bg{transform:scale(1.05)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.88) 100%)}
.badges{position:absolute;top:22px;left:22px;display:flex;gap:8px;z-index:2}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:500;background:rgba(255,255,255,.2);backdrop-filter:blur(12px)}
.card .txt{position:relative;z-index:2;padding:28px}
.card .date{font-size:13px;opacity:.85;margin-bottom:8px}
.card h3{font-size:clamp(18px,2vw,24px);font-weight:600;line-height:1.3;margin-bottom:10px}
.card p{font-size:14px;opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{border:1px dashed #d4d4d4;border-radius:var(--radius);padding:46px;text-align:center;color:var(--muted);background:var(--soft)}
.events{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ev{border:1px solid var(--line);border-radius:22px;padding:22px;background:#fff}
.ev b{display:block;margin:6px 0}
.sv{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cal-layout{display:grid;grid-template-columns:1.9fr 1fr;gap:28px;align-items:start;margin-top:28px}
.panel{border:1px solid var(--line);border-radius:var(--radius);padding:28px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.cal-top h3{font-size:20px}
.cal-nav button{width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted)}
.cal-nav button:hover{background:var(--soft)}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow span{text-align:center;font-size:12px;color:var(--muted);padding:8px 0}
.day{min-height:92px;border-radius:14px;padding:8px;font-size:14px;font-weight:500;overflow:hidden}
.day.out{opacity:.25}
.day.today{outline:2px solid var(--red);background:#fff4f4}
.day.today .n{color:var(--red);font-weight:700}
.day .n{display:block;text-align:right;margin-bottom:4px}
.pill{display:block;font-size:10.5px;color:#fff;border-radius:999px;padding:2px 8px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-red{background:var(--red)}.p-orange{background:var(--orange)}.p-green{background:var(--green)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:18px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.item{border-left:3px solid var(--red);padding:4px 0 4px 14px;margin-top:20px}
.item.orange{border-color:var(--orange)}.item.green{border-color:var(--green)}
.item b{display:block;font-size:15px}.item span{display:block;font-size:12.5px;color:var(--muted)}
.fb{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;margin-top:28px}
form.f{display:grid;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label.l{font-size:13px;font-weight:600;display:grid;gap:7px}
input,select,textarea{font:inherit;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--soft);outline:0;transition:.2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink);background:#fff}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:46px;width:90px}
textarea{min-height:120px;resize:vertical}
.line-card{display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,140px);background:var(--ink);color:#fff;padding:14px 26px;border-radius:999px;transition:.4s;z-index:300;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
footer.ft{margin-top:90px;border-top:1px solid var(--line);padding:50px 0 30px;background:#fafafa}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
footer h4{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:500}
footer li{list-style:none;margin:9px 0;font-size:14px}
footer li a:hover{text-decoration:underline}
.copy{margin-top:40px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.copy a{opacity:.6}.copy a:hover{opacity:1;text-decoration:underline}
.social{display:flex;gap:10px;margin-top:18px}
.social a{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px;background:#fff;font-weight:600}
.page-login{min-height:100vh;padding:28px 48px;background:#fff}
.back{display:inline-flex;gap:10px;color:var(--muted);font-size:15px}
.lbox{max-width:520px;margin:9vh auto 0;text-align:center}
.lbox .eyebrow{margin:18px 0 12px}
.lbox h1{font-size:44px;font-weight:700;margin-bottom:10px}

.lcard small{display:block;margin-top:18px;color:var(--muted)}
.err{color:var(--red);margin-top:14px;font-size:14px}
.modal{position:fixed;inset:0;z-index:200;background:rgba(10,10,20,.65);backdrop-filter:blur(4px);display:flex;padding:16px;overflow:auto}
.mbox{position:relative;margin:auto;background:#fff;border-radius:24px;max-width:min(94vw,720px);width:100%;overflow:hidden;box-shadow:0 40px 90px -20px rgba(0,0,0,.6)}
.mbox img.big{width:100%;max-height:55vh;object-fit:cover}
.mbox .mt{padding:24px 28px 30px}
.mbox .mt h3{font-size:22px;margin:4px 0 12px}
.mbox .mt p{white-space:pre-line}
.mx{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:18px;z-index:3}
/* ADMIN */
.adm{display:grid;grid-template-columns:260px 1fr;min-height:100vh;background:#f4f4f6}
.adm aside{background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.adm aside h5{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:22px 8px 8px;font-weight:500}
.adm aside button{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:12px;font-size:14px;color:#444}
.adm aside button:hover{background:var(--soft)}
.adm aside button.on{background:var(--ink);color:#fff}
.adm main{padding:32px 40px 80px;min-width:0}
.adm main h1{font-size:26px;margin-bottom:6px}
.adm .card2{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:20px}
.adm .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.adm .fields .full{grid-column:1/-1}
.adm label.l small{font-weight:400;color:var(--muted)}
.row2{display:flex;gap:8px;align-items:center}
.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border:0}
.list-row b{display:block}.list-row small{color:var(--muted)}
.thumb{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--soft);flex:none}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.prev{max-height:90px;border-radius:10px;margin-top:8px}
.tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.new{background:#fee2e2;color:var(--red)}.tag.done{background:#dcfce7;color:#166534}
@media(max-width:900px){
  .news-grid,.events,.sv,.cal-layout,.fb,.fgrid,.two,.adm,.adm .fields{grid-template-columns:1fr}
  .nav .in{padding:0 16px}.wrap{padding:0 20px}
  .day{min-height:64px;padding:4px}.pill{font-size:0;height:6px;padding:0}
  .card{aspect-ratio:1/1.1}
  .adm aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;padding:12px}
  .adm aside h5{width:100%;margin:8px 4px 2px}.adm aside button{width:auto}
  .adm main{padding:20px 16px 60px}.page-login{padding:20px}
}
</style>
</head>

async function loadPublic(){
  try{
    const [s,n,ev,sv,lk]=await Promise.all([
      db.from('ac_settings').select('*'),
      db.from('ac_news').select('*').order('published_at',{ascending:false}),
      db.from('ac_events').select('*').order('start_date',{ascending:true}),
      db.from('ac_surveys').select('*').order('created_at',{ascending:false}),
      db.from('ac_links').select('*').order('sort',{ascending:true})]);
    const bad=[s,n,ev,sv,lk].find(x=>x.error);
    if(bad)throw bad.error;
    ST.S={...DEF,...Object.fromEntries(s.data.map(r=>[r.key,r.value]))};
    ST.news=n.data;ST.events=ev.data;ST.surveys=sv.data;ST.links=lk.data;ST.ok=true;
  }catch(err){
    console.warn('Supabase tables not ready, using defaults:',err);
    ST.ok=false;ST.news=DEF_NEWS;ST.links=DEF_LINKS;
  }
  applyTheme();
}
function applyTheme(){
  const r=document.documentElement.style;
  [['theme_red','--red'],['theme_orange','--orange'],['theme_green','--green']].forEach(([k,v])=>{const c=T(k);/^#[0-9a-f]{6}$/i.test(c)?r.setProperty(v,c):r.removeProperty(v)});
  document.title=T('site_title');
}

/* ============ AUTH ============ */
async function refreshUser(){
  const {data}=await db.auth.getSession();
  ST.user=data.session?.user||null;ST.isAdmin=false;
  if(ST.user){try{const r=await db.from('ac_admins').select('email');ST.isAdmin=!r.error&&r.data.length>0}catch(_){}}
}
const domainOk=em=>String(em||'').toLowerCase().endsWith(String(T('lg_domain')||'@ndlp.go.th').toLowerCase());
async function googleLogin(){
  const dom=String(T('lg_domain')).replace('@','');
  const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{hd:dom,prompt:'select_account'}}});
  if(error)toast('เข้าสู่ระบบไม่สำเร็จ: '+error.message);
}
async function logout(){await db.auth.signOut();ST.user=null;ST.isAdmin=false;location.hash='#/';render();toast('ออกจากระบบแล้ว')}
db.auth.onAuthStateChange(async ev=>{
  if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'){
    await refreshUser();
    if(ST.user&&!ST.isAdmin&&!domainOk(ST.user.email)){
      await db.auth.signOut();ST.user=null;sessionStorage.setItem('loginErr','บัญชีนี้ไม่ได้รับอนุญาต — ใช้ได้เฉพาะ '+T('lg_domain'));location.hash='#/login';
    }
    render();
  }
});

const route=()=>location.hash.replace(/^#/,'')||'/';
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
function goSection(id){
  if(route()!=='/'){location.hash='#/';setTimeout(()=>$(id)?.scrollIntoView({behavior:'smooth'}),80)}
  else $(id)?.scrollIntoView({behavior:'smooth'});
}
function linkAttr(u){u=String(u||'').trim();if(/^#[a-z]+$/i.test(u))return `href="#/" data-go="${u.slice(1)}"`;const s=safeUrl(u);return `href="${e(s||'#/')}"${/^https?:/i.test(s)?' target="_blank" rel="noopener"':''}`}
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-go]');if(a){ev.preventDefault();goSection(a.dataset.go)}});

function render(){
  const r=route();
  if(r==='/login')return pLogin();
  if(r==='/admin')return pAdmin();
  pHome();
}

function calHtml(){
  const y=ST.cal.getFullYear(),m=ST.cal.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),todayIso=iso(new Date());
  const TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  let cells='';const total=Math.ceil((first+dim)/7)*7;
  for(let i=0;i<total;i++){
    const d=new Date(y,m,i-first+1),out=d.getMonth()!==m,k=iso(d);
    const evs=ST.events.filter(v=>v.start_date&&v.start_date<=k&&(v.end_date||v.start_date)>=k).map(v=>`<span class="pill p-${e(v.kind)}" title="${e(v.title)}">${e(v.title)}</span>`).join('');
    cells+=`<div class="day${out?' out':''}${k===todayIso?' today':''}"><span class="n">${d.getDate()}</span>${out?'':evs}</div>`;
  }
  return `<div class="cal-top"><h3>${TH[m]} ${y+543}</h3><div class="cal-nav"><button onclick="calMove(-1)" aria-label="ก่อนหน้า">‹</button><button onclick="calMove(1)" aria-label="ถัดไป">›</button></div></div>
  <div class="dow"><span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div><div class="days">${cells}</div>`;
}

        <div class="two"><label class="l">ประเภทเรื่องที่แจ้ง<select name="category">${String(T('fb_cats')).split('\n').filter(Boolean).map(c=>`<option>${e(c)}</option>`).join('')}</select></label><label class="l">หัวข้อ<input name="subject" maxlength="200" placeholder="สรุปสั้น ๆ"></label></div>
        <label class="l">รายละเอียด<textarea name="detail" required maxlength="4000" placeholder="อธิบายปัญหาหรือข้อเสนอของคุณ"></textarea></label>
        <div><button class="btn btn-red" type="submit">${e(T('fb_btn'))}</button></div></form></div>
       <div class="panel line-card"><div><h3 style="font-size:20px;margin-bottom:10px">${e(T('line_title'))}</h3><p class="sub">${e(T('line_text'))}</p></div><a class="btn btn-line" ${linkAttr(T('line_url'))}>${e(T('line_btn'))}</a></div></div></section>
  </main>
  <footer class="ft"><div class="wrap"><div class="fgrid">
   <div><div class="brand" style="margin-bottom:6px">${(()=>{const l=safeImg(T('logo_url'));return l?`<img src="${e(l)}" alt="" style="height:34px">`:LOGO_SVG.replace('<svg','<svg style="width:22px;height:34px"')})()}<div>${e(T('ft_name'))}<br><small style="font-weight:400;color:var(--muted)">${e(T('ft_en'))}</small></div></div>
     <ul style="margin-top:16px">${T('ft_address')?`<li>📍 ${e(T('ft_address'))}</li>`:''}${T('ft_ig')?`<li>📷 ${e(T('ft_ig'))}</li>`:''}${T('ft_line')?`<li>💬 LINE ${e(T('ft_line'))}</li>`:''}</ul>${social?`<div class="social">${social}</div>`:''}</div>
   <div><h4>${e(T('ft_links_title'))}</h4><ul>${ST.links.map(l=>`<li><a ${linkAttr(l.url)}>${e(l.label)}</a></li>`).join('')}</ul></div>
   <div><h4>${e(T('ft_portal_title'))}</h4><p class="sub" style="font-size:13.5px">${e(T('ft_portal_text'))}</p>${ST.user?'':`<a class="btn btn-dark btn-sm" style="margin-top:14px" href="#/login">${e(T('ft_portal_btn'))}</a>`}</div>
  </div><div class="copy"><span>${e(T('ft_copy'))}</span><a href="#/admin">ผู้ดูแลระบบ</a></div></div></footer>`;
  const nav=$('nav');const sc=()=>nav.classList.toggle('solid',scrollY>60);sc();onscroll=sc;
  document.querySelectorAll('[data-news]').forEach(b=>b.onclick=()=>openNews(b.dataset.news));

function openNews(id){
  const n=ST.news.find(x=>String(x.id)===String(id));if(!n)return;const img=safeImg(n.image_url);
  $('modalRoot').innerHTML=`<div class="modal" id="mbg"><div class="mbox"><button class="mx" onclick="closeModal()" aria-label="ปิด">✕</button>${img?`<img class="big" src="${e(img)}" alt="">`:''}<div class="mt"><small class="sub">🗓 ${e(fdate(n.published_at))}</small><h3>${e(n.title)}</h3><p>${e(n.body)}</p></div></div></div>`;
  $('mbg').onclick=ev=>{if(ev.target.id==='mbg')closeModal()};document.body.style.overflow='hidden';
}
function closeModal(){$('modalRoot').innerHTML='';document.body.style.overflow=''}
addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});

async function sendFeedback(ev){
  ev.preventDefault();const f=ev.target,fd=new FormData(f),b=f.querySelector('button');b.disabled=true;
  const {error}=await db.from('ac_feedback').insert({name:fd.get('name'),email:fd.get('email')||null,category:fd.get('category'),subject:fd.get('subject')||null,detail:fd.get('detail')});
  b.disabled=false;
  if(error){toast('ส่งไม่สำเร็จ: ตรวจสอบว่ารัน supabase.sql แล้ว');console.warn(error);return}
  f.reset();toast(T('fb_ok'));
}

   <div class="eyebrow">${e(T('lg_eyebrow'))}</div><h1>${e(T('lg_title'))}</h1><p class="sub">${e(T('lg_sub'))}</p>
   <div class="lcard"><button class="btn gbtn" id="gl">${GOOGLE_SVG}${e(T('lg_btn'))}</button><small>${e(T('lg_note'))}</small>${err?`<div class="err">${e(err)}</div>`:''}</div>
   <p class="sub" style="font-size:13px;margin-top:26px">${e(T('lg_terms'))}</p></div></div>`;

/* ============ ADMIN ============ */
const NAVS=[['เนื้อหาเว็บไซต์',SCHEMA.map(s=>[s.g,s.title])],['ข้อมูล',[['ac_news','ข่าวประชาสัมพันธ์'],['ac_events','กิจกรรม / ปฏิทิน'],['ac_surveys','แบบสอบถาม'],['ac_links','ลิงก์ฟุตเตอร์']]],['ระบบ',[['inbox','กล่องข้อเสนอแนะ'],['admins','ผู้ดูแลระบบ']]]];
async function pAdmin(){
  if(!ST.user){sessionStorage.setItem('loginErr','กรุณาเข้าสู่ระบบก่อนเข้าพื้นที่ผู้ดูแล');location.hash='#/login';return}
  if(!ST.isAdmin){$('app').innerHTML=`<div class="page-login"><a class="back" href="#/">← กลับหน้าแรก</a><div class="lbox"><h1 style="font-size:30px">ไม่มีสิทธิ์ผู้ดูแล</h1><p class="sub" style="margin-top:12px">บัญชี ${e(ST.user.email)} ยังไม่ได้อยู่ในรายชื่อผู้ดูแล<br>ให้แอดมินเดิมเพิ่มอีเมลนี้ที่เมนู “ผู้ดูแลระบบ” หรือเพิ่มในตาราง ac_admins</p><p style="margin-top:20px"><button class="btn btn-dark btn-sm" onclick="logout()">ออกจากระบบ</button></p></div></div>`;return}
  $('app').innerHTML=`<div class="adm"><aside><div class="brand" style="margin-bottom:8px">${brandHtml()}</div>
   ${NAVS.map(([h,items])=>`<h5>${h}</h5>${items.map(([k,l])=>`<button data-tab="${k}" class="${ST.tab===k?'on':''}">${l}</button>`).join('')}`).join('')}
   <h5>บัญชี</h5><button onclick="location.hash='#/'">← ดูหน้าเว็บ</button><button onclick="logout()">ออกจากระบบ</button></aside><main id="admMain"></main></div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.tab;pAdmin()});
  const t=ST.tab,m=$('admMain');
  if(SCHEMA.find(s=>s.g===t))return admSettings(t,m);
  if(TABLES[t])return admTable(t,m);
  if(t==='inbox')return admInbox(m);
  if(t==='admins')return admAdmins(m);
}
function fieldHtml([k,label,type,extra],val,full){
  const v=val??'';const w=full?' full':'';
  if(type==='bool')return `<label class="l${w}" style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-k="${k}" data-t="bool" ${v?'checked':''}> ${label}</label>`;
  if(type==='textarea')return `<label class="l${w}">${label}<textarea data-k="${k}">${e(v)}</textarea></label>`;
  if(type==='select')return `<label class="l${w}">${label}<select data-k="${k}">${extra.map(([a,b])=>`<option value="${a}" ${v===a?'selected':''}>${b}</option>`).join('')}</select></label>`;
  if(type==='image')return `<div class="l${w}" style="display:grid;gap:7px;font-size:13px;font-weight:600">${label}<div class="row2"><input data-k="${k}" data-t="image" value="${e(v)}" placeholder="วางลิงก์รูป หรือกดอัปโหลด"><label class="btn btn-out btn-sm" style="cursor:pointer">อัปโหลด<input type="file" accept="image/*" hidden data-up="${k}"></label></div>${safeImg(v)?`<img class="prev" src="${e(v)}" alt="">`:''}</div>`;
  if(type==='color')return `<label class="l${w}">${label}<input type="color" data-k="${k}" value="${/^#[0-9a-f]{6}$/i.test(v)?v:'#000000'}"></label>`;
  return `<label class="l${w}">${label}<input data-k="${k}" type="${type==='number'?'number':type==='date'?'date':'text'}" value="${e(v)}"></label>`;
}
function bindUploads(root){
  root.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{
    const file=inp.files[0];if(!file)return;
    if(file.size>5*1024*1024){toast('ไฟล์ใหญ่เกิน 5MB');return}
    toast('กำลังอัปโหลด...');
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await db.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
    if(error){toast('อัปโหลดไม่สำเร็จ (ตรวจสอบ bucket ac-media): '+error.message);return}
    const url=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const t=root.querySelector(`[data-k="${inp.dataset.up}"]`);t.value=url;
    const wrap=t.closest('div.l');wrap.querySelector('img.prev')?.remove();wrap.insertAdjacentHTML('beforeend',`<img class="prev" src="${e(url)}" alt="">`);
    toast('อัปโหลดแล้ว — กดบันทึกเพื่อใช้งาน');
  });
}
function collect(root){
  const o={};root.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
    o[k]=el.dataset.t==='bool'?el.checked:el.type==='number'?(el.value===''?null:Number(el.value)):el.value===''&&el.type==='date'?null:el.value});
  return o;
}
function admSettings(g,m){
  const s=SCHEMA.find(x=>x.g===g);
  m.innerHTML=`<div class="topbar"><div><h1>${s.title}</h1><p class="sub">แก้ไขแล้วกดบันทึก หน้าเว็บจะอัปเดตทันที</p></div><button class="btn btn-dark" id="sv">บันทึก</button></div>
   <div class="card2"><div class="fields" id="ff">${s.f.map(([k,l,t,d])=>fieldHtml([k,l,t],T(k),t==='textarea'||t==='image')).join('')}</div></div>
   <p style="margin-top:14px"><button class="btn btn-out btn-sm" id="rs">คืนค่าเริ่มต้นของหมวดนี้</button></p>`;
  bindUploads(m);
  const save=async vals=>{
    const rows=Object.entries(vals).map(([key,value])=>({key,value:String(value??'')}));
    const {error}=await db.from('ac_settings').upsert(rows,{onConflict:'key'});
    if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return}
    ST.S={...ST.S,...vals};applyTheme();toast('บันทึกแล้ว');admSettings(g,m);
  };
  $('sv').onclick=()=>save(collect($('ff')));
  $('rs').onclick=()=>{if(confirm('คืนค่าเริ่มต้นทุกช่องในหมวดนี้?'))save(Object.fromEntries(s.f.map(([k,,,d])=>[k,d])))};
}
async function admTable(t,m){
  const cfg=TABLES[t];m.innerHTML='<p class="sub">กำลังโหลด...</p>';
  const {data,error}=await db.from(t).select('*').order(cfg.order[0],{ascending:cfg.order[1]});
  if(error){m.innerHTML=`<h1>${cfg.title}</h1><div class="card2">โหลดไม่ได้: ${e(error.message)}<br><small class="sub">ตรวจสอบว่ารัน supabase.sql แล้ว</small></div>`;return}
  m.innerHTML=`<div class="topbar"><div><h1>${cfg.title}</h1><p class="sub">${data.length} รายการ</p></div><button class="btn btn-dark" id="add">+ เพิ่มใหม่</button></div>
   <div class="card2">${data.map(r=>`<div class="list-row"><div class="row2" style="min-width:0">${cfg.img&&safeImg(cfg.img(r))?`<img class="thumb" src="${e(cfg.img(r))}" alt="">`:''}<div style="min-width:0"><b>${e(cfg.label(r))}</b><small>${e(cfg.sub(r))}</small></div></div><div class="row2"><button class="btn btn-out btn-sm" data-ed="${r.id}">แก้ไข</button><button class="btn btn-out btn-sm" style="color:var(--red)" data-dl="${r.id}">ลบ</button></div></div>`).join('')||'<p class="sub">ยังไม่มีข้อมูล</p>'}</div>`;
  const edit=row=>{
    const vals={...cfg.def,...(row||{})};
    $('modalRoot').innerHTML=`<div class="modal" id="mbg"><div class="mbox"><button class="mx" onclick="closeModal()">✕</button><div class="mt"><h3>${row?'แก้ไข':'เพิ่ม'} · ${cfg.title}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px" id="ef">${cfg.f.map(f=>fieldHtml(f,vals[f[0]],f[3]==='full'||f[2]==='image'||f[2]==='textarea')).join('')}</div><p style="margin-top:20px"><button class="btn btn-dark" id="es">บันทึก</button></p></div></div></div>`;
    document.querySelectorAll('#ef .full').forEach(x=>x.style.gridColumn='1/-1');
    bindUploads($('modalRoot'));
    $('es').onclick=async()=>{
      const o=collect($('ef'));
      const q=row?db.from(t).update(o).eq('id',row.id):db.from(t).insert(o);
      const {error}=await q;if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return}
      closeModal();toast('บันทึกแล้ว');await loadPublic();admTable(t,m);
    };
  };
  $('add').onclick=()=>edit(null);
  m.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>edit(data.find(r=>String(r.id)===b.dataset.ed)));
  m.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{
    if(!confirm('ลบรายการนี้?'))return;
    const {error}=await db.from(t).delete().eq('id',b.dataset.dl);
    if(error){toast('ลบไม่สำเร็จ: '+error.message);return}
    toast('ลบแล้ว');await loadPublic();admTable(t,m);
  });
}
async function admInbox(m){
  const {data,error}=await db.from('ac_feedback').select('*').order('created_at',{ascending:false}).limit(200);
  if(error){m.innerHTML=`<h1>กล่องข้อเสนอแนะ</h1><div class="card2">โหลดไม่ได้: ${e(error.message)}</div>`;return}
  m.innerHTML=`<h1>กล่องข้อเสนอแนะ</h1><p class="sub">${data.length} รายการ</p><div class="card2">${data.map(r=>`<div class="list-row" style="align-items:flex-start"><div style="min-width:0"><b>${e(r.subject||r.category||'(ไม่มีหัวข้อ)')} <span class="tag ${r.status==='done'?'done':'new'}">${r.status==='done'?'จัดการแล้ว':'ใหม่'}</span></b><small>${e(r.name)}${r.email?' · '+e(r.email):''} · ${e(new Date(r.created_at).toLocaleString('th-TH'))} · ${e(r.category||'')}</small><p style="white-space:pre-line;margin-top:6px;font-size:14px">${e(r.detail)}</p></div><div class="row2"><button class="btn btn-out btn-sm" data-st="${r.id}" data-v="${r.status==='done'?'new':'done'}">${r.status==='done'?'ทำเป็นใหม่':'ทำเครื่องหมายแล้ว'}</button><button class="btn btn-out btn-sm" style="color:var(--red)" data-dl="${r.id}">ลบ</button></div></div>`).join('')||'<p class="sub">ยังไม่มีข้อความ</p>'}</div>`;
  m.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{await db.from('ac_feedback').update({status:b.dataset.v}).eq('id',b.dataset.st);admInbox(m)});
  m.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{if(confirm('ลบข้อความนี้?')){await db.from('ac_feedback').delete().eq('id',b.dataset.dl);admInbox(m)}});
}
async function admAdmins(m){
  const {data,error}=await db.from('ac_admins').select('*').order('email');
  if(error){m.innerHTML=`<h1>ผู้ดูแลระบบ</h1><div class="card2">${e(error.message)}</div>`;return}
  m.innerHTML=`<h1>ผู้ดูแลระบบ</h1><p class="sub">อีเมลที่ล็อกอินด้วย Google แล้วเข้าหน้านี้ได้</p>
   <div class="card2"><div class="row2"><input id="ne" type="email" placeholder="อีเมลผู้ดูแลใหม่"><button class="btn btn-dark" id="na">เพิ่ม</button></div>
   ${data.map(r=>`<div class="list-row"><b>${e(r.email)}</b>${r.email.toLowerCase()===ST.user.email.toLowerCase()?'<small>(คุณ)</small>':`<button class="btn btn-out btn-sm" style="color:var(--red)" data-dl="${e(r.email)}">ลบ</button>`}</div>`).join('')}</div>`;
  $('na').onclick=async()=>{const v=$('ne').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(v))return toast('อีเมลไม่ถูกต้อง');
    const {error}=await db.from('ac_admins').insert({email:v});if(error)return toast(error.message);toast('เพิ่มแล้ว');admAdmins(m)};
  m.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{if(confirm('ลบผู้ดูแลคนนี้?')){await db.from('ac_admins').delete().eq('email',b.dataset.dl);admAdmins(m)}});
}

(async()=>{await loadPublic();await refreshUser();render()})();
