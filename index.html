<script>
/* ============ FIREBASE CONFIG ============ */
const firebaseConfig = {
  apiKey: "AIzaSyADgdWqEOaAxzPakXcPk8sbD5uvo3r7Ju0",
  authDomain: "na-chueak-phitthayasan.firebaseapp.com",
  projectId: "na-chueak-phitthayasan",
  storageBucket: "na-chueak-phitthayasan.firebasestorage.app",
  messagingSenderId: "127524356300",
  appId: "1:127524356300:web:9292777595a40f29684269",
  measurementId: "G-XB322WXP30"
};
firebase.initializeApp(firebaseConfig);
try { if (firebase.analytics) firebase.analytics(); } catch (_) {}
const fsdb=firebase.firestore(), fauth=firebase.auth(), fstorage=firebase.storage();
const googleProvider = new firebase.auth.GoogleAuthProvider();
const BOOTSTRAP_ADMIN_EMAIL = 'flame12470@gmail.com';
const BUCKET='ac-media';
const firebaseError=err=>({message:err?.message||String(err||'เกิดข้อผิดพลาด'),code:err?.code||''});
class Query {
  constructor(table){this.table=table;this.action='select';this.payload=null;this.filters=[];this.sort=null;this.max=null;this.conflict=null}
  select(){return this}
  order(key,opt={}){this.sort={key,ascending:opt.ascending!==false};return this}
  eq(key,value){this.filters.push([key,value]);return this}
  limit(n){this.max=n;return this}
  insert(v){this.action='insert';this.payload=v;return this}
  update(v){this.action='update';this.payload=v;return this}
  delete(){this.action='delete';return this}
  upsert(v,opt={}){this.action='upsert';this.payload=v;this.conflict=opt.onConflict||'id';return this}
  async run(){
    try{
      const col=fsdb.collection(this.table);
      if(this.action==='insert'){
        const rows=Array.isArray(this.payload)?this.payload:[this.payload],out=[];
        for(const row of rows){const ref=col.doc();const saved={created_at:row.created_at||new Date().toISOString(),...row};await ref.set({...saved});out.push({...saved,id:ref.id})}
        return {data:out,error:null};
      }
      if(this.action==='upsert'){
        const rows=Array.isArray(this.payload)?this.payload:[this.payload],out=[];
        for(const row of rows){const key=row[this.conflict];let ref=key?col.doc(String(key)):col.doc();await ref.set({...row},{merge:true});out.push({...row,id:ref.id})}
        return {data:out,error:null};
      }
      let snap=await col.get(),rows=snap.docs.map(d=>({id:d.id,...d.data()}));
      rows=rows.filter(r=>this.filters.every(([k,v])=>String(r[k]??'')===String(v??'')));
      if(this.sort){const {key,ascending}=this.sort;rows.sort((a,b)=>{let x=a[key],y=b[key];if(x==null)x='';if(y==null)y='';let c=x<y?-1:x>y?1:0;return ascending?c:-c})}
      if(this.max!=null)rows=rows.slice(0,this.max);
      if(this.action==='update'||this.action==='delete'){
        for(const row of rows){const ref=col.doc(String(row.id));if(this.action==='delete')await ref.delete();else await ref.set(this.payload,{merge:true})}
        return {data:rows,error:null};
      }
      return {data:rows,error:null};
    }catch(err){return {data:null,error:firebaseError(err)}}
  }

const ST={S:{...DEF},news:[],events:[],surveys:[],links:[],socials:[],council:[],lost:[],summary:[],stats:null,ready:false,ok:true,user:null,isAdmin:false,cal:(()=>{const d=new Date();d.setDate(1);return d})(),tab:'brand'};
const T=k=>ST.S[k]??DEF[k]??'';

async function loadPublic(){
  try{
    const [s,n,ev,sv,lk]=await Promise.all([
      db.from('ac_settings').select('*'),
      db.from('ac_news').select('*').order('published_at',{ascending:false}),
      db.from('ac_events').select('*').order('start_date',{ascending:true}),
      db.from('ac_surveys').select('*').order('created_at',{ascending:false}),
      db.from('ac_links').select('*').order('sort',{ascending:true})]);
    const bad=[s,n,ev,sv,lk].find(x=>x.error);
    if(bad)throw bad.error;
    ST.S={...DEF,...Object.fromEntries(s.data.map(r=>[r.key,r.value]))};
    ST.news=n.data;ST.events=ev.data;ST.surveys=sv.data;ST.links=lk.data;ST.ok=true;
    const so=await db.from('ac_socials').select('*').order('sort',{ascending:true});
    if(so.error)console.warn('ac_socials not ready (ตรวจสอบคอลเลกชันใน Firebase Firestore):',so.error);
    ST.socials=so.error?[]:so.data;
    for(const [k,t,o] of [['council','ac_council','sort'],['lost','ac_lost','created_at'],['summary','ac_summary','created_at']]){const r=await db.from(t).select('*').order(o,{ascending:o==='sort'});ST[k]=r.error?[]:r.data}
    try{localStorage.setItem('ac_logo',safeImg(T('logo_url')))}catch(_){}
  }catch(err){
    console.warn('Supabase tables not ready:',err);
    ST.ok=false;ST.news=[];ST.events=[];ST.surveys=[];ST.links=[];ST.socials=[];
  }
  applyTheme();
}
function applyTheme(){
  const r=document.documentElement.style;
  [['theme_red','--red'],['theme_orange','--orange'],['theme_green','--green']].forEach(([k,v])=>{const c=T(k);/^#[0-9a-f]{6}$/i.test(c)?r.setProperty(v,c):r.removeProperty(v)});
  document.title=T('site_title');
}

/* ============ AUTH (อีเมล + รหัสผ่าน) ============ */
/* ลิงก์ในอีเมลที่หมดอายุ/ใช้แล้ว จะส่ง error กลับมาทาง hash */
(()=>{const h=location.hash;if(/error_description=/.test(h)){const q=new URLSearchParams(h.replace(/^#/,''));
  sessionStorage.setItem('loginErr',q.get('error_code')==='otp_expired'?'ลิงก์หมดอายุหรือถูกใช้ไปแล้ว — กรุณาขอลิงก์ใหม่':(q.get('error_description')||'ลิงก์ไม่ถูกต้อง'));
  history.replaceState(null,'',location.pathname+'#/login')}})();
async function refreshUser(session){
  if(session===undefined){const {data}=await db.auth.getSession();session=data.session}
  ST.user=session?.user||null;ST.isAdmin=false;
  if(ST.user){
    const em=String(ST.user.email||'').trim().toLowerCase();
    ST.isAdmin=(em===BOOTSTRAP_ADMIN_EMAIL);
    try{const r=await db.from('ac_admins').select('email');if(!r.error&&Array.isArray(r.data))ST.isAdmin=ST.isAdmin||r.data.some(a=>String(a.email||'').trim().toLowerCase()===em)}catch(_){}
  }
}
const domainOk=em=>{let d=String(T('lg_domain')||'').trim().toLowerCase();if(!d)return true;if(d[0]!=='@')d='@'+d;return String(em||'').toLowerCase().endsWith(d)};
const MIN_PW=6;
function authMsg(m){m=String(m||'');
  if(/invalid login|wrong-password|user-not-found|invalid-credential/i.test(m))return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
  if(/not confirmed|email.*not verified/i.test(m))return 'กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ';
  if(/already (been )?registered|email-already-in-use/i.test(m))return 'อีเมลนี้สมัครไว้แล้ว — ลองเข้าสู่ระบบ หรือกด “ลืมรหัสผ่าน”';
  if(/same password|different from the old/i.test(m))return 'รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม';
  if(/password.*(least|short|weak)|weak|weak-password/i.test(m))return 'รหัสผ่านสั้นหรือคาดเดาง่ายเกินไป — ใช้อย่างน้อย '+MIN_PW+' ตัวอักษร';
  if(/rate limit|too many|only request this after|security purposes|too-many-requests/i.test(m))return 'ทำรายการถี่เกินไป กรุณารอสักครู่แล้วลองใหม่';
  if(/session missing/i.test(m))return 'ลิงก์หมดอายุ — กรุณากด “ลืมรหัสผ่าน” เพื่อขอลิงก์ใหม่';
  return m||'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง'}
function amsg(t,m,resend){const el=$('amsg');if(!el)return;
  el.innerHTML=`<div class="${t==='ok'?'okm':'err'}">${e(m)}</div>${resend?`<button type="button" class="alink" id="resend">ส่งอีเมลยืนยันอีกครั้ง</button>`:''}`;
  if(resend)$('resend').onclick=async()=>{const {error}=await db.auth.resend({type:'signup',email:resend,options:{emailRedirectTo:location.origin+location.pathname}});
    error?amsg('err',authMsg(error.message),resend):amsg('ok','ส่งอีเมลยืนยันแล้ว กรุณาตรวจกล่องจดหมาย (รวมถึงสแปม)')}}
async function doIn(f){
  const em=String(f.get('email')).trim();
  const {error}=await db.auth.signInWithPassword({email:em,password:f.get('password')});
  if(error)return amsg('err',authMsg(error.message),/not confirmed/i.test(error.message)?em:'');
  toast('เข้าสู่ระบบแล้ว');
}
async function doUp(f){
  const em=String(f.get('email')).trim(),pw=String(f.get('password'));
  if(!domainOk(em))return amsg('err','สมัครได้เฉพาะอีเมลโดเมน '+T('lg_domain'));
  if(!f.get('grade')||!f.get('room'))return amsg('err','กรุณาเลือกระดับชั้นและห้อง');
  if(pw.length<MIN_PW)return amsg('err','รหัสผ่านต้องมีอย่างน้อย '+MIN_PW+' ตัวอักษร');
  if(pw!==f.get('password2'))return amsg('err','รหัสผ่านสองช่องไม่ตรงกัน');
  const {data,error}=await db.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:String(f.get('name')||'').trim(),grade:String(f.get('grade')||''),room:String(f.get('room')||'')}}});
  if(error)return amsg('err',authMsg(error.message));
  if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)return amsg('err',authMsg('already registered'));
  if(!data.session){ST.authMode='in';ST.msg={t:'ok',m:'สมัครสำเร็จ! ส่งลิงก์ยืนยันไปที่ '+em+' แล้ว — กดลิงก์ในอีเมลก่อน แล้วกลับมาเข้าสู่ระบบ'};return pLogin()}
  toast('สมัครและเข้าสู่ระบบแล้ว');
}
async function doForgot(f){
  const em=String(f.get('email')).trim();
  const {error}=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  if(error)return amsg('err',authMsg(error.message));
  amsg('ok','หากอีเมลนี้มีบัญชีอยู่ ระบบได้ส่งลิงก์ตั้งรหัสผ่านใหม่ให้แล้ว — ตรวจกล่องจดหมาย (รวมถึงสแปม)');
}
async function doRec(f){
  const pw=String(f.get('password'));
  if(pw.length<MIN_PW)return amsg('err','รหัสผ่านต้องมีอย่างน้อย '+MIN_PW+' ตัวอักษร');
  if(pw!==f.get('password2'))return amsg('err','รหัสผ่านสองช่องไม่ตรงกัน');
  const {error}=await db.auth.updateUser({password:pw});
  if(error)return amsg('err',authMsg(error.message));
  ST.recovery=false;toast('ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว');location.hash=ST.isAdmin?'#/admin':'#/';render();
}
async function logout(){ST.recovery=false;await db.auth.signOut();ST.user=null;ST.isAdmin=false;location.hash='#/';render();toast('ออกจากระบบแล้ว')}
/* หมายเหตุ: ไม่ await เรียก supabase ภายใน callback โดยตรง (กัน deadlock) จึงใช้ setTimeout */
db.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY'){ST.recovery=true;ST.user=session?.user||null;location.hash='#/login';setTimeout(render,0);return}
  if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='USER_UPDATED'){
    setTimeout(async()=>{
      await refreshUser(session);
      if(ST.user&&!ST.isAdmin&&!domainOk(ST.user.email)){
        await db.auth.signOut();ST.user=null;sessionStorage.setItem('loginErr','บัญชีนี้ไม่ได้รับอนุญาต — ใช้ได้เฉพาะอีเมลโดเมน '+T('lg_domain'));location.hash='#/login';
      }
      render();
    },0);
  }
});

const route=()=>location.hash.replace(/^#/,'')||'/';

function goSection(id){
  if(route()!=='/'){location.hash='#/';setTimeout(()=>$(id)?.scrollIntoView({behavior:'smooth'}),80)}

}
function linkAttr(u){u=String(u||'').trim();if(/^#[a-z]+$/i.test(u))return `href="#/" data-go="${u.slice(1)}"`;const s=safeUrl(u);return `href="${e(s||'#/')}"${/^https?:/i.test(s)?' target="_blank" rel="noopener"':''}`}
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-go]');if(a){ev.preventDefault();closeModal();goSection(a.dataset.go)}});

function render(){
  if(!ST.ready)return showBoot();

  if(r==='/login')return pLogin();
  if(r==='/admin')return pAdmin();
  if(r.startsWith('/p/'))return pPage(r.slice(3));
  pHome();
}

function calHtml(){
  const y=ST.cal.getFullYear(),m=ST.cal.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),todayIso=iso(new Date());
  const TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  let cells='';const total=Math.ceil((first+dim)/7)*7;
  for(let i=0;i<total;i++){
    const d=new Date(y,m,i-first+1),out=d.getMonth()!==m,k=iso(d);
    const evs=ST.events.filter(v=>v.start_date&&v.start_date<=k&&(v.end_date||v.start_date)>=k).map(v=>`<span class="pill p-${e(v.kind)}" title="${e(v.title)}">${e(v.title)}</span>`).join('');
    cells+=`<div class="day${out?' out':''}${k===todayIso?' today':''}"><span class="n">${d.getDate()}</span>${out?'':evs}</div>`;
  }
  return `<div class="cal-top"><h3>${TH[m]} ${y+543}</h3><div class="cal-nav"><button onclick="calMove(-1)" aria-label="ก่อนหน้า">‹</button><button onclick="calMove(1)" aria-label="ถัดไป">›</button></div></div>
  <div class="dow"><span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div><div class="days">${cells}</div>`;
}

async function renderAdminTab(){
  const t=ST.tab,m=$('admMain');

}
function fieldHtml([k,label,type,extra],val,full){
  const v=val??'';const w=full?' full':'';
  if(type==='note')return `<p class="sub full" style="font-size:13px;grid-column:1/-1">${label}</p>`;
  if(type==='bool')return `<label class="l${w}" style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-k="${k}" data-t="bool" ${v?'checked':''}> ${label}</label>`;
  if(type==='textarea')return `<label class="l${w}">${label}<textarea data-k="${k}">${e(v)}</textarea></label>`;
  if(type==='select')return `<label class="l${w}">${label}<select data-k="${k}">${extra.map(([a,b])=>`<option value="${a}" ${v===a?'selected':''}>${b}</option>`).join('')}</select></label>`;
  if(type==='image')return `<div class="l${w}" style="display:grid;gap:7px;font-size:13px;font-weight:600">${label}<div class="row2"><input data-k="${k}" data-t="image" value="${e(v)}" placeholder="วางลิงก์รูป หรือกดอัปโหลด"><label class="btn btn-out btn-sm" style="cursor:pointer">อัปโหลด<input type="file" accept="image/*" hidden data-up="${k}"></label></div>${safeImg(v)?`<img class="prev" src="${e(v)}" alt="">`:''}</div>`;
  if(type==='color')return `<label class="l${w}">${label}<input type="color" data-k="${k}" value="${/^#[0-9a-f]{6}$/i.test(v)?v:'#000000'}"></label>`;
  return `<label class="l${w}">${label}<input data-k="${k}" type="${type==='number'?'number':type==='date'?'date':'text'}" value="${e(v)}"></label>`;
}
function bindUploads(root){
  root.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{
    const file=inp.files[0];if(!file)return;
    if(file.size>5*1024*1024){toast('ไฟล์ใหญ่เกิน 5MB');return}
    toast('กำลังอัปโหลด...');
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await db.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
    if(error){toast('อัปโหลดไม่สำเร็จ (ตรวจสอบ bucket ac-media): '+error.message);return}
    const url=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const t=root.querySelector(`[data-k="${inp.dataset.up}"]`);t.value=url;
    const wrap=t.closest('div.l');wrap.querySelector('img.prev')?.remove();wrap.insertAdjacentHTML('beforeend',`<img class="prev" src="${e(url)}" alt="">`);
    toast('อัปโหลดแล้ว — กดบันทึกเพื่อใช้งาน');
  });
}
function collect(root){
  const o={};root.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
    o[k]=el.dataset.t==='bool'?el.checked:el.type==='number'?(el.value===''?null:Number(el.value)):el.value===''&&el.type==='date'?null:el.value});
  return o;
}

  m.innerHTML=`<h1>ผู้ดูแลระบบ</h1><p class="sub">อีเมลในรายการนี้ที่สมัครใช้งานและยืนยันอีเมลแล้ว จะเข้าหน้านี้ได้</p>

   ${data.map(r=>`<div class="list-row"><b>${e(r.email)}</b>${r.email.toLowerCase()===ST.user.email.toLowerCase()?'<small>(คุณ)</small>':`<button class="btn btn-out btn-sm" style="color:var(--red)" data-dl="${e(r.email)}">ลบ</button>`}</div>`).join('')}</div>`;
  $('na').onclick=async()=>{const v=$('ne').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(v))return toast('อีเมลไม่ถูกต้อง');
    const {error}=await db.from('ac_admins').insert({email:v});if(error)return toast(error.message);toast('เพิ่มแล้ว');admAdmins(m)};
  m.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{if(confirm('ลบผู้ดูแลคนนี้?')){await db.from('ac_admins').delete().eq('email',b.dataset.dl);admAdmins(m)}});
}

/* ============ BOOT ============ */
(async()=>{try{await loadPublic();await refreshUser()}catch(x){console.warn(x)}ST.ready=true;render();track()})();
;
/* ============ LIVE UPDATE: ดึงข้อมูลจาก Firebase Firestore ทุก 5 วินาที ============ */
let liveRefreshBusy=false;
setInterval(async()=>{
  if(!ST.ready || liveRefreshBusy || ST.recovery) return;
  const currentRoute=route();
  /* ไม่รบกวนหน้าแอดมิน หน้าเข้าสู่ระบบ หรือหน้าฟอร์มย่อย */
  if(currentRoute!=='/') return;
  if(document.querySelector('#modalRoot .modal, #modalRoot .dbg')) return;
  const active=document.activeElement;
  if(active && active.matches && active.matches('input,textarea,select,button')) return;
  /* ถ้ามีการกรอกข้อมูลค้างอยู่ ห้าม render ทับ เพราะจะทำให้ค่าที่พิมพ์หาย */
  if([...document.querySelectorAll('#app input, #app textarea, #app select')].some(el=>String(el.value||'').trim()!=='')) return;

  liveRefreshBusy=true;
  const keepRoute=currentRoute;
  const keepY=window.scrollY || 0;
  try{
    await loadPublic();
    if(route()===keepRoute && ST.ready){
      render();
      requestAnimationFrame(()=>window.scrollTo({top:keepY,left:0,behavior:'instant'}));
    }
  }catch(err){
    console.warn('Live refresh failed:',err);
  }finally{
    liveRefreshBusy=false;
  }
},5000);

</script>
