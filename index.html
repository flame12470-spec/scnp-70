<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สภานักเรียน | Student Council</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--navy:#4b237c;--blue:#6d35a8;--sky:#f4c542;--ink:#241633;--mute:#6e6478;--bg:#fffdf6;--line:#eee4f7;--sh:0 12px 34px -14px rgba(75,35,124,.28)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--navy)}
body{min-height:100vh;display:flex;flex-direction:column;margin:0;font:400 clamp(14px,1.1vw + 11px,16px)/1.65 Anuphan,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
main{flex:1 0 auto;min-width:0}
@supports(height:1dvh){body{min-height:100dvh}}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
/* nav */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
header::after{content:"";position:absolute;left:0;right:0;top:100%;height:clamp(14px,2.5vw,26px);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.nav{max-width:1240px;margin:auto;padding:10px clamp(12px,3vw,24px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:clamp(17px,2.4vw,22px);color:var(--navy);text-decoration:none;white-space:nowrap}
.brand img{height:clamp(30px,5vw,42px);width:auto}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:6px clamp(10px,1.6vw,14px);font-size:clamp(13px,1.6vw,16px);border-radius:999px;text-decoration:none;color:var(--mute);font-weight:500;white-space:nowrap}
nav a:hover{color:var(--navy);background:color-mix(in srgb,var(--blue) 9%,#fff)}
nav a.on{color:var(--navy);font-weight:700}
/* hero + coverflow */
.hero{--fade:clamp(70px,9vw,130px);padding-bottom:calc(var(--fade) * .55);position:relative;display:flex;flex-direction:column;min-height:calc(100vh - 68px);background:linear-gradient(180deg,var(--navy) 0%,var(--blue) 45%,var(--sky) 100%);color:#fff;text-align:center;overflow:hidden}
@supports(height:1dvh){.hero{min-height:calc(100dvh - 68px)}}
.hero h1{margin:0;padding:clamp(18px,4vw,30px) 12px 0;font-weight:700;line-height:1.05;position:relative;z-index:1}
.hero h1 small{display:block;font-size:clamp(26px,6vw,80px)}
.hero h1 span{display:block;font-size:clamp(30px,9vw,130px);margin-top:4px;text-shadow:0 8px 30px rgba(0,0,0,.2)}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.2;box-shadow:0 0 8px 2px rgba(255,255,255,.75);animation:tw var(--t,3s) ease-in-out var(--dl,0s) infinite;pointer-events:none}
.star.sp{border-radius:0;box-shadow:none;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation-name:tw2}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.45)}50%{opacity:1;transform:scale(1.2)}}
@keyframes tw2{0%,100%{opacity:.1;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.stage{--gap:min(30vw,340px);position:relative;flex:1;min-height:340px;touch-action:pan-y;user-select:none;-webkit-user-select:none;z-index:2;margin-top:calc(-1 * clamp(40px,9vw,150px))}
.sl{position:absolute;top:0;bottom:0;left:50%;transform-origin:50% 100%;transform:translateX(calc(-50% + var(--o,0)*var(--gap))) scale(calc((1 - var(--a,0)*.17) * var(--zoom,1)));filter:brightness(calc(1 - var(--a,0)*.14));transition:transform .6s cubic-bezier(.25,.8,.25,1),opacity .6s,filter .6s;cursor:pointer}
.sl.c{cursor:default}
.sl img{height:100%;width:auto;max-width:none;object-fit:contain;object-position:bottom;pointer-events:none;-webkit-user-drag:none}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:clamp(50px,10vw,90px) 16px calc(var(--fade) * .55 + 10px);background:linear-gradient(180deg,transparent 0,color-mix(in srgb,var(--sky) 94%,transparent) calc((100% - var(--fade)) * .6),color-mix(in srgb,var(--sky) 94%,transparent) calc(100% - var(--fade)),color-mix(in srgb,var(--sky) 45%,#fff) calc(100% - var(--fade) * .45),#fff 100%);pointer-events:none}
.cap b{display:block;font-size:clamp(22px,4.6vw,48px);line-height:1.1}
.cap span{display:block;font-size:clamp(14px,2.2vw,24px);opacity:.95}
.cap a{display:inline-block;margin-top:6px;font-size:clamp(13px,1.8vw,16px);border-bottom:2px solid #fff;text-decoration:none;font-weight:600;pointer-events:auto}
.dots{display:flex;gap:8px;justify-content:center;margin-top:12px;pointer-events:auto}
.dots i{width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.5);cursor:pointer;transition:width .3s,background .3s}
.dots i.on{width:26px;background:#fff}
.arr{position:absolute;top:42%;z-index:35;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:22px;backdrop-filter:blur(6px)}
.arr:hover{background:rgba(255,255,255,.45)}.arr.l{left:22px}.arr.r{right:22px}
/* sections */
.wrap{max-width:1240px;margin:auto;padding:0 clamp(14px,3vw,24px)}
section{padding:clamp(44px,8vw,80px) 0}
.alt{background:var(--bg)}
h2.t{margin:0 0 clamp(24px,5vw,44px);text-align:center;font-size:clamp(23px,4vw,44px);color:var(--navy);font-weight:700;line-height:1.25}
.center{text-align:center}
.lead{max-width:880px;margin:0 auto 22px;font-size:clamp(15px,2vw,21px);color:var(--mute)}
.btn{display:inline-block;background:var(--navy);color:#fff;border:2px solid #fff;border-radius:999px;padding:clamp(8px,1.4vw,11px) clamp(18px,3vw,26px);font-size:clamp(14px,1.8vw,16px);font-weight:700;text-decoration:none;box-shadow:0 10px 26px -8px rgba(18,49,143,.6);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:clamp(14px,2.4vw,24px)}
.card{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--sh);background:var(--blue);cursor:pointer;aspect-ratio:4/5;border:0;padding:0;text-align:left;color:#fff;transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.card>img{width:100%;height:100%;object-fit:cover;object-position:center top}
.ph{width:100%;height:100%;display:grid;place-items:center;padding:24px;text-align:center;font-size:clamp(18px,3vw,24px);font-weight:700;background:linear-gradient(160deg,var(--blue),var(--sky))}
.badge{position:absolute;top:16px;left:16px;padding:6px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:2}
.badge.done{background:#22c55e;color:#fff}.badge.doing{background:#fbbf24;color:#6b3f00}
.badge.doing::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#b45309;margin-right:8px}
.badge.done::before{content:"✓ "}
.why{aspect-ratio:3/4}
.why .ov{position:absolute;inset:auto 0 0 0;padding:90px 22px 22px;background:linear-gradient(180deg,transparent,rgba(5,15,50,.85))}
.why .ov h3{margin:0 0 4px;font-size:clamp(19px,3vw,24px)}
.why .ov p{margin:0;font-size:14px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* members */
.mem{position:relative;flex:none;width:clamp(150px,22vw,250px);aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,var(--blue),var(--sky));box-shadow:var(--sh);color:#fff}
.mem>img{width:100%;height:100%;object-fit:cover;object-position:center top}
.mem .ov{position:absolute;inset:auto 0 0 0;padding:70px 14px 12px;background:linear-gradient(180deg,transparent,rgba(5,15,50,.88))}
.mem .ov b{display:block;font-size:clamp(17px,2.4vw,24px);line-height:1.2}
.mem .ov em{display:block;font-style:normal;font-size:14px;font-weight:600;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:6px;margin:4px 0}
.mem .ov small{font-size:11px;opacity:.85}
.rows{overflow:hidden;display:grid;gap:22px;padding:6px 0 14px}
.track{display:flex;width:max-content;animation:mv var(--d,30s) linear infinite;will-change:transform}
.track .mem{margin-right:22px}
@media(hover:hover) and (pointer:fine){.rows:hover .track{animation-play-state:paused}}
.track.rev{animation-direction:reverse}
@keyframes mv{to{transform:translateX(-50%)}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:clamp(12px,2vw,22px)}
@media(min-width:600px){.mgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.mgrid .mem{width:auto;margin:0}
/* countdown */
.cd{background:linear-gradient(180deg,var(--navy) 0%,var(--blue) 45%,var(--sky) 100%);color:#fff;text-align:center}
.cd h2{margin:0;font-size:clamp(22px,4vw,46px)}
.cd p{font-size:clamp(14px,2.4vw,26px);margin:8px 0 clamp(22px,5vw,38px)}
.cdw{display:flex;justify-content:center;gap:clamp(8px,3vw,42px);flex-wrap:nowrap}
.unit small{display:block;margin-top:8px;font-size:clamp(12px,2vw,19px)}
.pair{display:flex;gap:clamp(4px,1vw,10px)}
.dig{width:clamp(34px,8.5vw,108px);height:clamp(46px,11.5vw,140px);border-radius:12px;background:linear-gradient(180deg,#434a58 0,#434a58 50%,#0b0d12 50%,#0b0d12 100%);display:grid;place-items:center;font-size:clamp(26px,6.5vw,80px);font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.dig.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateX(-80deg);opacity:.3}100%{transform:none;opacity:1}}
.cd{position:relative;overflow:hidden;padding-bottom:clamp(110px,14vw,200px)}
.cd::before{content:"";position:absolute;left:0;right:0;top:0;height:clamp(28px,5vw,60px);background:linear-gradient(180deg,#fff,rgba(255,255,255,0));pointer-events:none}
.cd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:clamp(88px,11.25vw,163px);background:linear-gradient(180deg,transparent 0,color-mix(in srgb,var(--sky) 55%,transparent) 35%,color-mix(in srgb,var(--sky) 45%,#fff) 70%,#fff 100%);pointer-events:none}
/* sub pages */
.phero{position:relative;padding:clamp(48px,9vw,90px) 12px;text-align:center;color:#fff;background:linear-gradient(180deg,var(--navy) 0%,var(--blue) 45%,var(--sky) 100%) center/cover}
.phero::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--blue) 72%,transparent)}
.phero>*{position:relative}
.phero h1{margin:0;font-size:clamp(26px,6vw,60px)}
.phero p{margin:8px 0 0;font-size:clamp(14px,2.4vw,24px);opacity:.95}
.pdf{width:100%;height:min(80vh,820px);border:0;border-radius:22px;background:#222;box-shadow:var(--sh)}
.leader{display:grid;grid-template-columns:clamp(220px,28vw,320px) 1fr;gap:clamp(20px,4vw,48px);align-items:center;padding:54px 0}
.leader img,.leader .ph2{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;border-radius:24px;box-shadow:var(--sh);background:linear-gradient(160deg,#5b7fe0,#a8c4f5)}
.leader h3{margin:0;font-size:clamp(22px,3vw,30px)}
.leader .pos{color:var(--blue);font-weight:600;font-size:clamp(15px,2vw,18px);margin-bottom:18px}
.leader h4{margin:18px 0 8px;font-size:clamp(16px,2vw,20px)}
.leader ul{margin:0;padding-left:20px}
.leader li{margin:4px 0;color:#2b3656}
.leader li::marker{color:var(--blue)}
.lalt{background:var(--bg)}
.cls{margin:0 0 18px;font-size:clamp(22px,3.4vw,38px);color:var(--navy)}
.cls-b{margin-bottom:70px}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:clamp(14px,2.4vw,26px)}
.ncard{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;box-shadow:var(--sh);cursor:pointer;text-align:left;padding:0;transition:transform .2s}
.ncard:hover{transform:translateY(-4px)}
.ncard img,.ncard .ph3{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:center top;background:linear-gradient(160deg,var(--blue),var(--sky))}
.ncard div.b{padding:18px 20px 22px}
.ncard small{color:var(--mute)}
.ncard h3{margin:4px 0 6px;font-size:clamp(16px,2.2vw,20px)}
.ncard p{margin:0;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{background:var(--bg);border-radius:22px;text-align:center;color:var(--mute);padding:80px 20px}
/* modal: พอดีหน้าจอทุกอุปกรณ์ */
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,12,40,.62);backdrop-filter:blur(4px);display:flex;padding:14px;overflow:auto;overscroll-behavior:contain}
.mwrap{position:relative;margin:auto;max-width:94vw}
.mbox{position:relative;width:fit-content;max-width:min(94vw,760px);max-height:calc(100vh - 28px);overflow:auto;border-radius:26px;background:linear-gradient(180deg,var(--blue),var(--navy) 55%,var(--sky));color:#fff;box-shadow:0 40px 90px -20px rgba(0,0,0,.6)}
@supports(height:1dvh){.mbox{max-height:calc(100dvh - 28px)}}
.mbox.light{background:#fff;color:var(--ink)}
.mbox.imgonly{background:none;box-shadow:none;overflow:visible;border-radius:0}
.mbox.imgonly img.big{border-radius:24px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.mbox.txt{width:min(600px,94vw)}
.mbox img.big{display:block;margin:auto;width:auto;height:auto;max-width:min(94vw,760px);max-height:var(--ih,calc(100vh - 28px));object-fit:contain}
.mtxt{padding:clamp(16px,3vw,22px) clamp(16px,3vw,26px) clamp(20px,3vw,28px)}
.mbox:not(.txt) .mtxt{width:0;min-width:100%}
.mtxt h3{margin:4px 0 10px;font-size:clamp(19px,3.4vw,26px);line-height:1.3}
.mtxt p{margin:0;white-space:pre-line;font-size:clamp(14px,2vw,17px)}
.mbox .badge{top:14px;left:14px}
.x{position:absolute;top:10px;right:10px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:color-mix(in srgb,var(--navy) 88%,transparent);color:#fff;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.annc{text-align:center;padding:clamp(34px,6vw,46px) clamp(18px,4vw,30px) clamp(26px,5vw,38px)}
.annc img.lg{height:clamp(52px,12vw,72px);margin:0 auto 10px;filter:brightness(0) invert(1)}
.annc h3{font-size:clamp(20px,5vw,34px);margin:20px 0 12px;line-height:1.3}
.annc p{white-space:pre-line;font-size:clamp(14px,2.4vw,17px);margin:0 0 16px}
footer{position:relative;flex:none;background:linear-gradient(180deg,#fff 0%,color-mix(in srgb,var(--sky) 22%,#fff) 100%);color:var(--navy);padding:clamp(20px,4vw,30px) 0 calc(clamp(20px,4vw,30px) + env(safe-area-inset-bottom,0px))}
footer::before{display:none}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer .l{display:flex;gap:10px;align-items:center}
footer img.fl{height:clamp(32px,6vw,46px);width:auto}
footer b{font-size:clamp(15px,2.4vw,18px)}
footer small{display:block;opacity:.85;font-size:clamp(12px,2vw,15px)}
.ct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ct>span{font-weight:600;font-size:clamp(13px,2vw,15px);opacity:.9}
.ct a{box-shadow:0 2px 8px -2px rgba(18,49,143,.25);display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--navy);padding:6px clamp(10px,2vw,16px) 6px 8px;border-radius:999px;font-weight:600;font-size:clamp(12px,1.8vw,14px);text-decoration:none;line-height:1.2;max-width:100%}
.ct a:hover{background:#eaf1ff}
.ct a .ic{width:clamp(20px,3.2vw,26px);height:clamp(20px,3.2vw,26px);border-radius:50%;object-fit:contain;flex:none;display:grid;place-items:center}
.ct a svg.ic{fill:var(--navy);padding:3px;background:#eef3ff}
.ct a img.ic{background:#fff}
@media(min-width:641px) and (max-width:820px){.nav{flex-direction:column;align-items:stretch;gap:6px;padding:8px 12px}nav{justify-content:flex-start}}
@media(max-width:820px){.leader{grid-template-columns:1fr;gap:20px}.leader>img,.leader .ph2{max-width:300px;margin:auto}.wrap{padding:0 16px}.arr{display:none}.track .mem{margin-right:14px}.stage{min-height:300px}}
@media(min-width:700px) and (min-height:600px){.stage{--zoom:1.14;--gap:min(32vw,430px);min-height:clamp(480px,54vw,860px);margin-top:calc(-1 * clamp(60px,11vw,200px))}}
@media(max-width:480px){.hero{min-height:auto}.stage{min-height:min(118vw,520px);flex:none}.modal{padding:10px}.x{width:38px;height:38px;font-size:18px}.ct{width:100%}footer .wrap{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){.track{animation:none}html{scroll-behavior:auto}.sl{transition:none}.dig.flip{animation:none}.star{animation:none;opacity:.6}}

/* hamburger (มือถือเท่านั้น) */
.burger{display:none;position:relative;width:46px;height:46px;border:0;border-radius:50%;background:color-mix(in srgb,var(--blue) 10%,#fff);flex:none;transition:background .3s,transform .3s}
.burger:hover{background:color-mix(in srgb,var(--blue) 18%,#fff)}
.burger:active{transform:scale(.9)}
.burger i{position:absolute;left:13px;right:13px;height:3px;border-radius:3px;background:var(--navy);transition:transform .45s cubic-bezier(.68,-.5,.27,1.5),opacity .25s,right .3s,background .3s}
.burger i:nth-child(1){top:15px}
.burger i:nth-child(2){top:22px;right:20px;transform-origin:left}
.burger i:nth-child(3){top:29px}
.burger:hover i:nth-child(2){right:13px}
.burger.open{background:var(--navy)}
.burger.open i{background:#fff}
.burger.open i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open i:nth-child(2){opacity:0;transform:translateX(-14px) scaleX(0)}
.burger.open i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mback{display:none}
@media(max-width:640px){
  .nav{flex-direction:row;align-items:center}
  .burger{display:block}
  .mback{display:block;position:fixed;inset:0;z-index:48;background:rgba(5,12,40,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
  .mback.show{opacity:1;pointer-events:auto}
  nav#nav{position:absolute;z-index:49;top:calc(100% + 6px);left:12px;right:12px;flex-direction:column;gap:4px;padding:12px;overflow:hidden;background:#fff;border-radius:24px;box-shadow:0 24px 60px -16px rgba(18,49,143,.55);transform-origin:top right;transform:translateY(-14px) scale(.92);opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .3s,visibility 0s .4s}
  nav#nav.open{transform:none;opacity:1;visibility:visible;transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .3s,visibility 0s}
  nav#nav a{font-size:17px;padding:13px 18px;border-radius:16px;opacity:0;transform:translateX(-22px);transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.3,1.2),background .2s}
  nav#nav.open a{opacity:1;transform:none;transition-delay:calc(var(--i)*55ms + 90ms)}
  nav#nav a.on{background:linear-gradient(90deg,color-mix(in srgb,var(--blue) 14%,#fff),#fff);box-shadow:inset 4px 0 0 var(--blue)}
}
@media(prefers-reduced-motion:reduce){.burger i,nav#nav,nav#nav a,.mback{transition:none!important}}

/* policies marquee (มือถือ) / รูปใต้นับถอยหลัง / หน้าเพิ่มเติม */
.cs{display:block}
.cs.mob{display:none}
.pcard{display:block;text-decoration:none}
.cs-s{display:grid;grid-template-columns:1fr;gap:clamp(14px,2.4vw,24px);width:min(78vw,340px);margin:0 auto}
.cs-s>*{display:none}
.cs-s>.on{display:block;animation:csIn .6s ease backwards}
@keyframes csIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.cs-dots{display:flex;gap:8px;justify-content:center;margin-top:16px}
.cs-dots i{width:9px;height:9px;border-radius:99px;background:#c7d2ee;cursor:pointer;transition:width .3s,background .3s}
.cs-dots i.on{width:26px;background:var(--blue)}
@media(min-width:700px){.cs-s{grid-template-columns:repeat(3,minmax(0,1fr));width:min(calc(100% - 48px),1240px)}}
.cdimg{margin:clamp(22px,5vw,40px) auto 0;max-width:min(100%,760px)}
.cdimg img{margin:auto;width:auto;max-height:min(60vh,440px);border-radius:20px;box-shadow:0 18px 40px -14px rgba(0,0,0,.5)}
.ctext{max-width:860px;margin:0 auto 36px;white-space:pre-line;font-size:clamp(15px,2vw,19px);line-height:1.85}
.cgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(12px,2vw,22px)}
.czoom{padding:0;border:0;background:none;border-radius:20px;overflow:hidden;box-shadow:var(--sh);cursor:zoom-in;line-height:0}
.czoom img{width:100%;height:auto;transition:transform .35s}
.czoom:hover img{transform:scale(1.03)}
@media(max-width:640px){.pol-g{display:none}.cs.mob{display:block}}
@media(prefers-reduced-motion:reduce){.rows{overflow-x:auto}}
.pno{position:absolute;top:14px;right:16px;z-index:3;width:68px;height:68px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-content:center;text-align:center;line-height:1;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2)}.pno small{font-size:11px}.pno b{font-size:26px}
.lpic{position:absolute;left:3%;bottom:0;height:min(72%,380px);max-width:34%;z-index:2;object-fit:contain;object-position:left bottom;pointer-events:none}
/* ภาพที่บันทึกไว้ให้เต็มพื้นหลังแบนเนอร์ แล้วค่อยวางชั้นไล่สีฟุ้งทับ */
.hero .lpic{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center;z-index:0;opacity:.88;bottom:0}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(18,49,143,.82) 0%,rgba(29,79,216,.72) 45%,rgba(77,179,245,.48) 78%,rgba(255,255,255,.18) 100%)}
.hero h1{z-index:2}
.hero .stage{z-index:2}
.hero .fuzz{z-index:3}
.hero .cap{z-index:4}
.hero .pno{z-index:5}
.fuzz{--fade:clamp(70px,9vw,130px);position:absolute;left:0;right:0;bottom:0;height:calc(var(--fade) * 1.25);z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent 0,color-mix(in srgb,var(--sky) 55%,transparent) 35%,color-mix(in srgb,var(--sky) 45%,#fff) 70%,#fff 100%)}
.hero.nofade .cap{background:none}
.bump{position:relative;z-index:3;margin-top:-44px;text-align:center;pointer-events:none}.bump img{display:block;margin:0 auto;max-width:100%;max-height:140px;object-fit:contain}
@media(max-width:700px){.phero .lpic{display:none}.hero .lpic{height:34%;max-width:40%}}
/* FINAL OVERRIDE: ภาพพื้นหลังเต็มแบนเนอร์ทุกขนาดหน้าจอ */
.hero .lpic,.phero .lpic{display:block;inset:0;left:0;bottom:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center;z-index:0;opacity:.88}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(18,49,143,.82) 0%,rgba(29,79,216,.72) 45%,rgba(77,179,245,.48) 78%,rgba(255,255,255,.18) 100%)}
.hero h1,.hero .stage{z-index:2}
.hero .fuzz,.phero .fuzz{z-index:1}
.hero .cap{z-index:4}
.phero::before{z-index:1}
.phero>*:not(.lpic):not(.fuzz){z-index:2}
</style>

<div id="modal"></div>

<script>
const db=supabase.createClient('https://aefzegkgfwszuiznihsk.supabase.co','sb_publishable_Z1zogpI9qqUlegxG816ncQ_eHeaiFvr');
const D={cfg:{},slides:[],policies:[],members:[],leaders:[],news:[],why:[]};
const $=id=>document.getElementById(id);
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines=v=>String(v||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
const fdate=v=>v?new Date(v).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}):'';
const cfg=(k,d='')=>D.cfg[k]||d;
/* ชื่อพรรค (ถ้าในฐานข้อมูลยังเป็นชื่อเก่า จะใช้ชื่อใหม่แทนอัตโนมัติ) */
const OLD_NAMES=['พรรคคอนเน็กซ์','Connext Party','พรรคคอนนิวเตอร์','Connor Newte'];
const NAME_TH='สภานักเรียน',NAME_EN='Student Council';
const HEX=/^#[0-9a-f]{6}$/i;
/* กันลิงก์ถูกเข้ารหัสซ้ำ (เช่น %20 กลายเป็น %2520) */
const encU=x=>{try{return encodeURI(decodeURI(x));}catch(_){return encodeURI(x);}};
const rowBg=id=>{try{return JSON.parse(cfg('row_bg')||'{}')[id]||'';}catch(_){return '';}};
/* พื้นหลังแบบสีหรือรูป -> สไตล์ CSS */
function bgCss(v){v=String(v||'').trim();if(!v)return '';
  if(HEX.test(v))return `background:${v}`;
  const u=encU(fixUrl(v)).replace(/[()'"]/g,c=>'%'+c.charCodeAt(0).toString(16));
  return `background:#e9edf6 center/cover no-repeat url(${u})`;}
const bgAttr=v=>{const b=bgCss(v);return b?` style="${e(b)}"`:'';};
/* พื้นหลังส่วนนับถอยหลัง: สีล้วน หรือรูป + ฟิล์มมืดให้อ่านตัวหนังสือออก */
const cdAttr=v=>{v=String(v||'').trim();if(!v)return '';let b;
  if(HEX.test(v))b=`background:${v}`;
  else{const u=encU(fixUrl(v)).replace(/[()'"]/g,c=>'%'+c.charCodeAt(0).toString(16));b=`background:linear-gradient(rgba(8,20,70,.55),rgba(8,20,70,.55)),url(${u}) center/cover no-repeat`;}
  return ` style="${e(b)}"`;};
function applyTheme(){
  const r=document.documentElement.style;
  [['theme_navy','--navy'],['theme_blue','--blue'],['theme_sky','--sky']].forEach(([k,v])=>{const c=cfg(k);if(HEX.test(c))r.setProperty(v,c);else r.removeProperty(v);});
  let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m);}
  m.content=HEX.test(cfg('theme_navy'))?cfg('theme_navy'):'#4b237c';
}
const pdfUrl=u=>{u=String(u||'').trim();const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);return m?'https://drive.google.com/file/d/'+m[1]+'/preview':u;};
const siteName=()=>{const v=cfg('site_name');return(!v||OLD_NAMES.includes(v))?NAME_TH:v;};
const siteEn=()=>{const v=cfg('site_en');return(!v||OLD_NAMES.includes(v))?NAME_EN:v;};
/* รับลิงก์รูปได้ทุกแบบ: ลิงก์ตรง, Google Drive, Dropbox, Imgur ฯลฯ */
function fixUrl(u){
  u=String(u||'').trim();if(!u)return '';
  let m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc|thumbnail)\?(?:[^#]*&)?id=([\w-]+)/);
  if(m)return 'https://lh3.googleusercontent.com/d/'+m[1];
  if(/dropbox\.com/.test(u))return u.replace('www.dropbox.com','dl.dropboxusercontent.com').replace(/[?&]dl=0/,'').replace(/[?&]raw=1/,'');
  m=u.match(/^https?:\/\/imgur\.com\/(?:a\/)?(\w+)$/);
  if(m&&!/\/a\//.test(u))return 'https://i.imgur.com/'+m[1]+'.jpg';
  if(/^\/\//.test(u))return 'https:'+u;
  if(/^[\w-]+(\.[\w-]+)+\/.+/.test(u)&&!/^https?:|^data:|^\//.test(u))return 'https://'+u;
  return u;
}
const U=(window.CSS&&CSS.supports&&CSS.supports('height','1dvh'))?'dvh':'vh';
const ROUTES=[['/','หน้าแรก','menu_home'],['/about','เกี่ยวกับสภาฯ','menu_about'],['/history','ทีมงานสภาฯ','menu_history'],['/members','ทำเนียบสมาชิก','menu_members'],['/policies','นโยบายและผลงาน','menu_policies'],['/news','ข่าวและกิจกรรม','menu_news'],['/services','บริการนักเรียน','menu_services'],['/resources','คลังความรู้','menu_resources'],['/contact','ติดต่อเรา','menu_contact']];
/* หน้าเพิ่มเติมที่แอดมินสร้างเอง เก็บเป็น JSON ใน cp_settings key = custom_pages */
function customPages(){try{const raw=cfg('custom_pages');if(!raw)return [];const p=typeof raw==='string'?JSON.parse(raw):raw;return Array.isArray(p)?p.filter(x=>x&&x.id&&x.title):[];}catch(_){return [];}}
const routes=()=>ROUTES.map(([p,l,k])=>[p,cfg(k,l)]).concat(customPages().filter(p=>p.show!==false).map(p=>['/p/'+p.id,p.title]));
let timers=[];
const clearTimers=()=>{timers.forEach(t=>typeof t==='function'?t():clearInterval(t));timers=[];};

async function fetchAll(){
  const q=(t,o)=>db.from(t).select('*').order(o,{ascending:true,nullsFirst:false});
  const [a,b,c,d,f,g,h]=await Promise.all([
    db.from('cp_settings').select('*'),q('cp_slides','sort'),q('cp_policies','sort'),q('cp_members','sort'),q('cp_leaders','sort'),
    db.from('cp_news').select('*').order('published_at',{ascending:false}),q('cp_why','sort')]);
  const err=a.error||b.error||c.error||d.error||f.error||g.error||h.error;
  if(err)return {err};
  return {sig:JSON.stringify([a.data,b.data,c.data,d.data,f.data,g.data,h.data]),a:a.data,b:b.data,c:c.data,d:d.data,f:f.data,g:g.data,h:h.data};
}
let sig='';
function apply(r){
  D.cfg=Object.fromEntries((r.a||[]).map(x=>[x.key,x.value]));
  D.slides=r.b;D.policies=r.c;D.members=r.d;D.leaders=r.f;D.news=r.g;D.why=r.h;sig=r.sig;
}
async function load(){
  const r=await fetchAll();
  if(r.err){$('app').innerHTML=`<section><div class="wrap"><div class="empty">โหลดข้อมูลไม่สำเร็จ: ${e(r.err.message)}<br>ตรวจสอบว่ารัน setup.sql แล้ว</div></div></section>`;return false;}
  apply(r);return true;
}
/* ดึงข้อมูลใหม่ทุก 2 วินาที อัปเดตหน้าเฉพาะเมื่อข้อมูลเปลี่ยน (ไม่ทำตอนเปิดป๊อบอัปหรือซ่อนแท็บ) */
let busy=false;
async function poll(){
  if(busy||document.hidden||$('modal').firstChild)return;
  busy=true;
  try{
    const r=await fetchAll();
    if(!r.err&&r.sig!==sig&&!$('modal').firstChild){
      const y=window.scrollY;apply(r);shell();route(true);window.scrollTo(0,y);
    }
  }catch(_){}finally{busy=false;}
}
function shell(){
  applyTheme();
  const n=siteName();
  document.title=n+' '+siteEn();
  const logo=fixUrl(cfg('site_logo'));
  $('brand').innerHTML=(logo?`<img src="${e(logo)}" alt="">`:'')+`<span>${e(n)}</span>`;
  $('fl').innerHTML=(logo?`<img class="fl" src="${e(logo)}" alt="">`:'')+`<div><b>${e(n)}</b><small>${e(siteEn())}</small></div>`;
  const cs=contacts();
  $('fk').innerHTML=cs.length?`<div class="ct"><span>ติดต่อเรา</span>${cs.map(c=>`<a href="${e(c.href)}" target="_blank" rel="noopener">${c.logo?`<img class="ic" src="${e(c.logo)}" alt="">`:ICONS[c.type]||ICONS.link}<span>${e(c.label)}</span></a>`).join('')}</div>`:'';
}
/* ช่องทางติดต่อ: เพิ่มเองได้ที่ cp_settings key = contacts (JSON) เช่น
   [{"label":"LINE","url":"https://line.me/ti/p/xxx","logo":"https://.../line.png"},{"label":"โทร","url":"tel:0812345678"}]
   ไม่ใส่ logo ระบบจะเลือกไอคอนให้ตามลิงก์ (instagram/facebook/line/tiktok/youtube/x/mail/tel) */
const ICONS={
 instagram:'<svg class="ic" viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm0 2a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3H7zm5 3.5A4.5 4.5 0 1112 16.5 4.5 4.5 0 0112 7.5zm0 2A2.5 2.5 0 1012 14.5 2.5 2.5 0 0012 9.5zM17.5 6a1 1 0 110 2 1 1 0 010-2z"/></svg>',
 facebook:'<svg class="ic" viewBox="0 0 24 24"><path d="M13.5 22v-8h2.7l.5-3.2h-3.2V8.7c0-.9.4-1.7 1.8-1.7h1.5V4.2S15.5 4 14.3 4C11.8 4 10 5.5 10 8.4v2.4H7.2V14H10v8h3.5z"/></svg>',
 line:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3 0 .7 0 1l-.1.9c0 .3-.2 1 .9.5s5.800-3.400 7.900-5.800C21.300 14.500 22 12.800 22 11c0-4.400-4.500-8-10-8z"/></svg>',
 tiktok:'<svg class="ic" viewBox="0 0 24 24"><path d="M16.5 3c.3 2.300 1.700 3.800 4 4v3c-1.400 0-2.800-.4-4-1.200V15a6 6 0 11-6-6c.3 0 .7 0 1 .1v3.100a3 3 0 102 2.800V3h3z"/></svg>',

function ctype(u){u=u.toLowerCase();
  if(u.startsWith('tel:'))return 'tel';if(u.startsWith('mailto:'))return 'mail';
  for(const [k,r] of [['instagram',/instagram\.com/],['facebook',/facebook\.com|fb\.com|fb\.me/],['line',/line\.me|lin\.ee/],['tiktok',/tiktok\.com/],['youtube',/youtube\.com|youtu\.be/],['x',/(^|\/\/|\.)(x|twitter)\.com/]])if(r.test(u))return k;
  return 'link';}
function contacts(){
  let arr=[];
  try{const raw=cfg('contacts');if(raw){const p=typeof raw==='string'?JSON.parse(raw):raw;if(Array.isArray(p))arr=p;}}catch(_){}
  if(!arr.length){
    if(cfg('instagram'))arr.push({label:'Instagram',url:cfg('instagram')});
    if(cfg('facebook'))arr.push({label:'Facebook',url:cfg('facebook')});
  }
  /* เบอร์โทร: เปิด/ปิดได้จากแอดมิน (phone_on = false คือซ่อน) */
  const ph=String(cfg('phone_number')||'').trim();
  if(ph&&cfg('phone_on')!=='false')arr.unshift({label:'โทร '+ph,url:'tel:'+ph.replace(/[^\d+]/g,'')});
  return arr.map(c=>{const u=String(c.url||c.href||'').trim();if(!u)return null;
    const href=/^(https?:|tel:|mailto:)/i.test(u)?u:(/^[\w.+-]+@[\w-]+\.[\w.]+$/.test(u)?'mailto:'+u:(/^\+?[\d\s-]{8,}$/.test(u)?'tel:'+u.replace(/[\s-]/g,''):'https://'+u));
    const type=c.type||ctype(href);
    return {href,type,label:c.label||c.name||({instagram:'Instagram',facebook:'Facebook',line:'LINE',tiktok:'TikTok',youtube:'YouTube',x:'X',mail:'อีเมล',tel:'โทร'}[type]||'ลิงก์'),logo:fixUrl(c.logo||c.icon||'')};
  }).filter(Boolean);
}
function navDraw(r){$('nav').innerHTML=routes().map((x,i)=>`<a href="#${x[0]}" style="--i:${i}" class="${x[0]===r?'on':''}">${x[1]}</a>`).join('');menu(false);}
function menu(on){
  $('nav').classList.toggle('open',on);$('burger').classList.toggle('open',on);$('mback').classList.toggle('show',on);
  $('burger').setAttribute('aria-expanded',on);
}
$('burger').onclick=()=>menu(!$('nav').classList.contains('open'));
$('mback').onclick=()=>menu(false);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')menu(false);});

const pgKey=()=>{const r=location.hash.slice(1)||'/',m=r.match(/^\/p\/([\w-]+)$/);return m?m[1]:({'/':'home','/about':'about','/history':'history','/members':'members','/policies':'policies','/news':'news'}[r]||'home');};
const pgImg=(pre,glob)=>{const m=cfg(pre+'_mode_'+pgKey())||'global';return m==='none'?'':m==='own'?cfg(pre+'_img_'+pgKey()):cfg(glob);};
const picTag=(u,c)=>u?`<img class="${c}" src="${e(fixUrl(u))}" alt="" referrerpolicy="no-referrer">`:'';
const deco=()=>(cfg('party_no_on')!=='false'&&cfg('party_no')?`<div class="pno"><small>เบอร์</small><b>${e(cfg('party_no'))}</b></div>`:'')+picTag(pgImg('lp','leader_photo'),'lpic');
const fzOn=()=>{const m=cfg('fz_mode_'+pgKey())||'global';return m==='on'||(m==='global'&&cfg('fz_on')!=='false');};
const hz=()=>fzOn()?'':' nofade';
const fuzz=()=>fzOn()&&pgKey()!=='home'?'<div class="fuzz"></div>':'';
const hero=(t,s)=>`<div class="phero" style="${cfg('page_hero')?`background-image:url('${e(encU(fixUrl(cfg('page_hero'))))}')`:''}">${deco()}${fuzz()}<h1>${e(t)}</h1>${s?`<p>${e(s)}</p>`:''}</div>`;
const img=(u,alt='',cls='')=>u?`<img ${cls?`class="${cls}" `:''}referrerpolicy="no-referrer" src="${e(fixUrl(u))}" alt="${e(alt)}" loading="lazy">`:'';

/* ---------- modal (ปรับขนาดให้พอดีทุกอุปกรณ์) ---------- */
function closeModal(){$('modal').innerHTML='';document.body.style.overflow='';}
function modal(html,cls='',style=''){

function initSliders(){
  const mq=window.matchMedia('(min-width:700px)');
  document.querySelectorAll('.cs').forEach(box=>{
    const cs=[...box.querySelectorAll('.cs-s>*')],dw=box.querySelector('.cs-dots'),n=cs.length;
    if(!n)return;let p=0,t=null,per=1,pages=1;
    const calc=()=>{per=mq.matches?3:1;pages=Math.ceil(n/per);dw.innerHTML=pages>1?'<i></i>'.repeat(pages):'';dw.querySelectorAll('i').forEach((d,k)=>d.onclick=()=>{show(k);start();});};
    const show=k=>{p=(k+pages)%pages;const on=new Set();for(let j=0;j<Math.min(per,n);j++)on.add((p*per+j)%n);cs.forEach((el,i)=>el.classList.toggle('on',on.has(i)));dw.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i===p));};
    const start=()=>{clearInterval(t);if(pages>1)t=setInterval(()=>show(p+1),3500);};
    const re=()=>{calc();show(0);start();};
    re();mq.addEventListener&&mq.addEventListener('change',re);
    timers.push(()=>{clearInterval(t);mq.removeEventListener&&mq.removeEventListener('change',re);});
  });
}

/* สไลด์แบบเห็นหลายคน: คนกลางใหญ่ คนข้าง ๆ อยู่ด้านหลัง เลื่อนอัตโนมัติ/ปัด/กดลูกศร */
function heroSlider(){
  const S=D.slides,n=S.length;if(!n)return;
  const els=[...document.querySelectorAll('.sl')],dots=[...document.querySelectorAll('.dots i')],st=$('stage');
  let cur=0,timer=null,drag=null,moved=false;
  const place=()=>{
    els.forEach((el,i)=>{
      let o=i-cur;if(o>n/2)o-=n;if(o<-n/2)o+=n;
      const a=Math.abs(o);
      el.style.setProperty('--o',o);el.style.setProperty('--a',Math.min(a,3));
      el.style.zIndex=10-a;el.style.opacity=a>2?0:(1-a*.18);el.style.pointerEvents=a>2?'none':'auto';
      el.classList.toggle('c',a===0);
    });
    dots.forEach((d,i)=>d.classList.toggle('on',i===cur));
    $('cn').textContent=S[cur].name||'';$('cr').textContent=S[cur].role||'';
  };
  const go=i=>{cur=(i+n)%n;place();};
  const stop=()=>{clearInterval(timer);timer=null;};
  const start=()=>{stop();if(n>1)timer=setInterval(()=>go(cur+1),4000);};
  place();start();timers.push(stop);
  els.forEach((el,i)=>el.onclick=()=>{if(!moved&&i!==cur)go(i);});
  dots.forEach((d,i)=>d.onclick=()=>{go(i);start();});
  if($('nx')){$('nx').onclick=()=>{go(cur+1);start();};$('pv').onclick=()=>{go(cur-1);start();};}
  st.onpointerdown=ev=>{drag=ev.clientX;moved=false;};
  st.onpointermove=ev=>{if(drag!==null&&Math.abs(ev.clientX-drag)>10)moved=true;};
  const up=ev=>{if(drag===null)return;const dx=ev.clientX-drag;drag=null;if(Math.abs(dx)>45)go(cur+(dx<0?1:-1));start();};
  st.onpointerup=up;st.onpointercancel=up;st.onpointerleave=up;
}

function marquee(arr,rev,idx=0){
  if(!arr.length)return '';
  let b=arr.slice();while(b.length<8)b=b.concat(arr);
  const base=Math.max(14,b.length*1.7),k=[1,1.22,.86,1.38,.94,1.15][idx%6],d=+(base*k*(.94+Math.random()*.12)).toFixed(1),dl=-(Math.random()*d).toFixed(1);
  return `<div class="track ${rev?'rev':''}" style="--d:${d}s;animation-delay:${dl}s">${b.concat(b).map(memCard).join('')}</div>`;
}
function countdown(){
  const raw=cfg('countdown'),t=new Date(raw).getTime(),ok=!!raw&&!isNaN(t);
  const labels=['วัน','ชั่วโมง','นาที','วินาที'];
  const vals=()=>{const d=ok?Math.max(0,Math.floor((t-Date.now())/1000)):0;return [Math.floor(d/86400),Math.floor(d%86400/3600),Math.floor(d%3600/60),d%60];};
  const v0=vals(),lens=[Math.max(2,String(v0[0]).length),2,2,2];
  $('cdw').innerHTML=labels.map((l,i)=>`<div class="unit"><div class="pair">${'<div class="dig">0</div>'.repeat(lens[i])}</div><small>${l}</small></div>`).join('');
  const units=[...document.querySelectorAll('#cdw .unit')];
  const upd=()=>{
    const v=vals();
    units.forEach((u,i)=>{
      const ds=[...u.querySelectorAll('.dig')],s=String(v[i]).padStart(ds.length,'0').slice(-ds.length);
      ds.forEach((d,k)=>{if(d.textContent!==s[k]){d.textContent=s[k];d.classList.remove('flip');void d.offsetWidth;d.classList.add('flip');}});
    });
    if(ok&&t<=Date.now()&&$('cdmsg'))$('cdmsg').textContent='ถึงวันเลือกตั้งแล้ว!';
  };
  upd();
  if(ok){timers.push(setInterval(upd,1000));
    const vis=()=>{if(!document.hidden)upd();};document.addEventListener('visibilitychange',vis);timers.push(()=>document.removeEventListener('visibilitychange',vis));}
}

 <div class="ncard" style="padding:24px"><h3>☎️ ติดต่อฉุกเฉิน</h3><p>ห้องพยาบาล: ${e(cfg('nurse_phone','กรุณาสอบถามโรงเรียน'))}</p><p>งานปกครอง: ${e(cfg('discipline_phone','กรุณาสอบถามโรงเรียน'))}</p></div>
 </div></section>`;
}
function pContact(){
 $('app').innerHTML=hero('ติดต่อสภานักเรียน','ยินดีรับฟังทุกความคิดเห็น')+
 `<section><div class="wrap center"><div class="lead">ห้องสภานักเรียน: ${e(cfg('council_room','กรุณาติดต่อโรงเรียนเพื่อยืนยันสถานที่'))}<br>เวลาทำการ: ${e(cfg('council_hours','ช่วงพักกลางวันและหลังเลิกเรียน'))}<br>อีเมล: ${cfg('council_email')?`<a href="mailto:${e(cfg('council_email'))}">${e(cfg('council_email'))}</a>`:'ยังไม่ได้ระบุอีเมลกลาง'}</div>${cfg('school_map_url')?`<a class="btn" href="${e(cfg('school_map_url'))}" target="_blank" rel="noopener">เปิดแผนที่โรงเรียน</a>`:''}</div></section>`;
}
function pAdmin(){
 $('app').innerHTML=hero('พื้นที่ผู้ดูแลระบบ','สำหรับคณะกรรมการสภานักเรียน')+
 `<section><div class="wrap" style="max-width:560px"><div class="ncard" style="padding:24px"><h3>เข้าสู่ระบบผู้ดูแล</h3><p>หน้านี้ใช้ Supabase Auth หากยังไม่ได้สร้างบัญชีผู้ดูแล จะไม่สามารถเข้าสู่ระบบได้</p><form id="adminDemo"><p><label>อีเมลผู้ดูแล</label><input type="email" required name="email" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px"></p><p><label>รหัสผ่าน</label><input type="password" required name="password" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px"></p><button class="btn" type="submit">เข้าสู่ระบบ</button><p id="adminMsg" aria-live="polite"></p></form></div></div></section>`;
 const f=$('adminDemo');f.onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(f);$('adminMsg').textContent='กำลังตรวจสอบ...';try{const {error}=await db.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});if(error)throw error;$('adminMsg').textContent='เข้าสู่ระบบสำเร็จ แต่ต้องสร้างหน้าแดชบอร์ดและกำหนดสิทธิ์ผู้ดูแลเพิ่มเติม';}catch(err){$('adminMsg').textContent='เข้าสู่ระบบไม่สำเร็จ ตรวจสอบบัญชี Supabase Auth และการตั้งค่า';}};
}

function pCustom(id){
  const p=customPages().find(x=>x.id===id);
  if(!p){$('app').innerHTML=hero('ไม่พบหน้านี้','')+`<section><div class="wrap"><div class="empty">ไม่พบหน้าที่ต้องการ หรือถูกลบไปแล้ว</div></div></section>`;return;}
  const ims=(p.images||[]).filter(Boolean);
  $('app').innerHTML=hero(p.title,p.sub)+`<section><div class="wrap">${p.body?`<div class="ctext">${e(p.body)}</div>`:''}${ims.length?`<div class="cgal">${ims.map(u=>`<button class="czoom" data-zoom="${e(u)}" aria-label="ดูรูปใหญ่">${img(u,p.title)}</button>`).join('')}</div>`:''}${!p.body&&!ims.length?'<div class="empty">ยังไม่มีเนื้อหา</div>':''}</div></section>`;
  bindCards();
}
let first=true;
function route(keep){
  clearTimers();closeModal();
  const r=(location.hash.slice(1)||'/');
  navDraw(r);
  const cm=r.match(/^\/p\/([\w-]+)$/);
  if(cm)pCustom(cm[1]);else ({'/':pHome,'/about':pAbout,'/history':pHistory,'/members':pMembers,'/policies':pPolicies,'/news':pNews,'/services':pServices,'/resources':pResources,'/contact':pContact,'/admin':pAdmin}[r]||pHome)();
  if(!keep)window.scrollTo(0,0);
  if(first){first=false;popup();}
}
window.addEventListener('hashchange',()=>route());
(async()=>{if(await load()){shell();route();setInterval(poll,2000);}})();
</script>
